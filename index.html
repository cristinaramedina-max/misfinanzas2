function FijosTab({ year, month, rate }) {
  const [items,   setItems] = useState(()=>gFx(year,month));
  const [form,    setForm]  = useState({name:'',amount:'',currency:'ARS',category:'Alquiler'});
  const [err,     setErr]   = useState(false);
  const [editing, setEditing] = useState(null); // { id, name, amount, currency }

  useEffect(()=>{ seedMonthIfEmpty(year,month); setItems(gFx(year,month)); setEditing(null); },[year,month]);

  const save  = d  => { sFx(year,month,d); setItems(d); };
  const del   = id => save(items.filter(i=>i.id!==id));
  const toggle= id => save(items.map(i=>i.id===id?{...i,paid:!i.paid}:i));

  const startEdit = item => setEditing({id:item.id, name:item.name, amount:String(item.amount), currency:item.currency});
  const applyEdit = () => {
    if(!editing||!editing.name.trim()||!editing.amount||parseFloat(editing.amount)<=0) { setEditing(null); return; }
    save(items.map(i=>i.id===editing.id?{...i,name:editing.name.trim(),amount:parseFloat(editing.amount),currency:editing.currency}:i));
    // Si es tarjeta TDC, actualizar límites (mes anterior)
    const cardNameMap = {Naranja:'naranja', Santander:'santander', Galicia:'galicia'};
    const cardKey = cardNameMap[editing.name.trim()];
    if(cardKey) sTDCLimits({...gTDCLimits(), [cardKey]: parseFloat(editing.amount)});
    setEditing(null);
  };

  const [dragId,  setDragId]  = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const touchRef = useRef(null);

  const reorder = (fromId, toId) => {
    if(!fromId||!toId||fromId===toId) return;
    const from = items.findIndex(i=>i.id===fromId);
    const to   = items.findIndex(i=>i.id===toId);
    if(from<0||to<0) return;
    const d=[...items]; d.splice(to,0,d.splice(from,1)[0]); save(d);
  };

  // HTML5 drag (desktop)
  const onDragStart = (e,id)  => { setDragId(id); e.dataTransfer.effectAllowed='move'; };
  const onDragOver  = (e,id)  => { e.preventDefault(); setOverIdx(id); };
  const onDrop      = (e,id)  => { e.preventDefault(); reorder(dragId,id); setDragId(null); setOverIdx(null); };
  const onDragEnd   = ()      => { setDragId(null); setOverIdx(null); };

  // Touch drag (mobile)
  const onTouchStart = (e,id) => { touchRef.current={id}; };
  const onTouchMove  = (e)    => {
    if(!touchRef.current) return;
    e.preventDefault();
    const t=e.touches[0];
    const el=document.elementFromPoint(t.clientX,t.clientY)?.closest('[data-fid]');
    if(el) { setOverIdx(el.dataset.fid); setDragId(touchRef.current.id); }
  };
  const onTouchEnd = () => {
    if(touchRef.current&&overIdx) reorder(touchRef.current.id, overIdx);
    touchRef.current=null; setDragId(null); setOverIdx(null);
  };

  const moveUp   = id => { const i=items.findIndex(x=>x.id===id); if(i<=0) return; const d=[...items]; [d[i-1],d[i]]=[d[i],d[i-1]]; save(d); };
  const moveDown = id => { const i=items.findIndex(x=>x.id===id); if(i>=items.length-1) return; const d=[...items]; [d[i],d[i+1]]=[d[i+1],d[i]]; save(d); };

  const add = () => {
    if(!form.name.trim()||!form.amount||parseFloat(form.amount)<=0){ setErr(true); return; }
    setErr(false);
    save([...items,{id:uid(),name:form.name.trim(),amount:parseFloat(form.amount),currency:form.currency,category:form.category,paid:false}]);
    setForm(f=>({...f,name:'',amount:''}));
  };

  const totalARS = items.reduce((a,i)=>a+toARS(i.amount,i.currency,rate),0);
  const paidARS  = items.filter(i=>i.paid).reduce((a,i)=>a+toARS(i.amount,i.currency,rate),0);

  return (
    <div className="fade-in">
      <div className="page-hd">
        <div className="page-title">Gastos Fijos</div>
        <div className="page-sub">{MONTHS[month]} {year} · {fARS(totalARS)} total</div>
      </div>

      {items.length>0 && (
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:'14px 16px',marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <span style={{fontSize:12,fontWeight:800,color:'var(--ink2)'}}>Progreso de pago</span>
            <span style={{fontSize:12,fontWeight:800,color:items.filter(f=>f.paid).length===items.length?'var(--purple-dark)':'var(--teal-dark)'}}>
              {items.filter(f=>f.paid).length} de {items.length} · {fARS(paidARS)} pagado
            </span>
          </div>
          <div style={{height:8,background:'var(--surface2)',borderRadius:99,overflow:'hidden',marginBottom:10}}>
            <div style={{height:'100%',borderRadius:99,transition:'width .4s ease',
              background:items.filter(f=>f.paid).length===items.length?'var(--purple)':'var(--teal-dark)',
              width:`${items.length>0?(items.filter(f=>f.paid).length/items.length)*100:0}%`
            }}></div>
          </div>
          {items.filter(f=>!f.paid).length===0 ? (
            <div style={{fontSize:12,color:'var(--purple-dark)',fontWeight:700,textAlign:'center'}}>✓ Todos los gastos fijos están pagados</div>
          ) : (
            <div style={{marginTop:4,fontSize:11,fontWeight:700,textAlign:'right'}}>
              Falta pagar: <span style={{color:'var(--teal-dark)'}}>{fARS(totalARS-paidARS)}</span>
            </div>
          )}
        </div>
      )}

      <div className="list-section">
        <div className="add-row">
          <input className={`add-inp desc${err&&!form.name?' err':''}`}
            placeholder="Nombre del gasto fijo (ej: Alquiler, Netflix...)"
            value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}
            onKeyDown={e=>e.key==='Enter'&&add()} />
          <input className={`add-inp amt${err&&(!form.amount||parseFloat(form.amount)<=0)?' err':''}`}
            type="number" placeholder="Monto" min="0"
            value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))}
            onKeyDown={e=>e.key==='Enter'&&add()} />
          <CurToggle value={form.currency} onChange={c=>setForm(f=>({...f,currency:c}))} />
          <select className="cat-sel" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
            {CATS_FIJOS.map(c=><option key={c} value={c}>{CAT_ICON[c]||'📦'} {c}</option>)}
          </select>
          <button className="add-btn" onClick={add} title="Agregar fijo">+</button>
        </div>

        {items.length===0 ? (
          <div className="empty">
            <div className="empty-ico">📌</div>
            <div className="empty-title">Sin gastos fijos</div>
            <div className="empty-sub">Agregá alquiler, servicios, suscripciones, cuotas...</div>
          </div>
        ) : items.map(item=>(
          editing && editing.id===item.id ? (
            <div key={item.id} className="item-edit-row">
              <input className="add-inp desc" value={editing.name}
                onChange={e=>setEditing(v=>({...v,name:e.target.value}))}
                onKeyDown={e=>{if(e.key==='Enter')applyEdit();if(e.key==='Escape')setEditing(null);}} autoFocus />
              <input className="add-inp amt" type="number" value={editing.amount}
                onChange={e=>setEditing(v=>({...v,amount:e.target.value}))}
                onKeyDown={e=>{if(e.key==='Enter')applyEdit();if(e.key==='Escape')setEditing(null);}} />
              <CurToggle value={editing.currency} onChange={c=>setEditing(v=>({...v,currency:c}))} />
              <button className="add-btn" onClick={applyEdit} style={{background:'var(--teal-dark)'}}>✓</button>
              <button className="add-btn" onClick={()=>setEditing(null)} style={{background:'var(--muted)'}}>✕</button>
            </div>
          ) : (
            <div key={item.id} className={`list-item${dragId===item.id?' dragging':''}${overIdx===item.id&&dragId!==item.id?' drag-over':''}`}
              data-fid={item.id}
              draggable
              onDragStart={e=>onDragStart(e,item.id)}
              onDragOver={e=>onDragOver(e,item.id)}
              onDrop={e=>onDrop(e,item.id)}
              onDragEnd={onDragEnd}
              onTouchStart={e=>onTouchStart(e,item.id)}
              onTouchMove={onTouchMove}
              onTouchEnd={onTouchEnd}
            >
              <span className="drag-handle">⠿</span>
              <div className="item-ico" style={{background:CAT_BG[item.category]||CAT_BG[item.name]||'#f0ebfc'}}>{CAT_ICON[item.category]||CAT_ICON[item.name]||'📦'}</div>
              <div className="item-info">
                <div className="item-name">{item.name}</div>
                <div className="item-meta">{item.category}</div>
              </div>
              <div className="item-right">
                <CurBadge currency={item.currency} />
                <div className="item-amt" style={{color:"var(--teal-dark)",fontWeight:700}}>{fCur(item.amount,item.currency)}</div>
                {item.currency==='USD' && <div className="item-conv">{fARS(item.amount*rate)}</div>}
                <button className={`paid-btn${item.paid?' paid':''}`} onClick={()=>toggle(item.id)} title={item.paid?'Marcar impago':'Marcar pagado'}>
                  {item.paid?'✓':'○'}
                </button>
                <button className="edit-btn" onClick={()=>startEdit(item)} title="Editar">✎</button>
                <DelBtn onClick={()=>del(item.id)} />
              </div>
            </div>
          )
        ))}

        {items.length>0 && (
          <div className="list-footer">
            <span>✓ Pagado: {fARS(paidARS)}</span>
            <span>Total: {fARS(totalARS)}</span>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── MOVIMIENTOS TAB ── */
function MovimientosTab({ year, month, rate }) {
  const [items,   setItems]   = useState(()=>gTx(year,month));
  const [form,    setForm]    = useState({type:'expense',desc:'',amount:'',currency:'ARS',category:'Comida',date:today()});
  const [filter,  setFilter]  = useState('all');
  const [err,     setErr]     = useState(false);
  const [editing, setEditing] = useState(null); // { id, desc, amount, currency }

  useEffect(()=>{ seedMonthIfEmpty(year,month); setItems(gTx(year,month)); setEditing(null); },[year,month]);

  const save = d => { sTx(year,month,d); setItems(d); };
  const del  = id => save(items.filter(i=>i.id!==id));

  const startEdit = item => setEditing({id:item.id, desc:item.desc, amount:String(item.amount), currency:item.currency, category:item.category, type:item.type});
  const applyEdit = () => {
    if(!editing||!editing.desc.trim()||!editing.amount||parseFloat(editing.amount)<=0){ setEditing(null); return; }
    save(items.map(i=>i.id===editing.id?{...i,desc:editing.desc.trim(),amount:parseFloat(editing.amount),currency:editing.currency,category:editing.category}:i));
    setEditing(null);
  };

  const add = () => {
    if(!form.desc.trim()||!form.amount||parseFloat(form.amount)<=0){ setErr(true); return; }
    setErr(false);
    const cat = form.type==='income' ? (CATS_INC.includes(form.category)?form.category:'Sueldo') : form.category;
    // Save to the month of the chosen date, not necessarily the current viewed month
    const d = new Date(form.date);
    const ty = d.getFullYear(), tm = d.getMonth();
    const targetTx = gTx(ty, tm);
    sTx(ty, tm, [...targetTx, {id:uid(),type:form.type,desc:form.desc.trim(),amount:parseFloat(form.amount),currency:form.currency,category:cat,date:form.date}]);
    // Refresh local items if same month
    if(ty===year && tm===month) setItems(gTx(year,month));
    notify();
    setForm(f=>({...f,desc:'',amount:''}));
  };

  const sum = calcSummary(year,month,rate);
  const libreUsedPct = sum.libreUsedPct||0;
  const barColor = libreUsedPct>=100?'var(--red)':libreUsedPct>=80?'var(--gold)':'var(--teal)';

  const filtered = items.filter(i=>{
    if(i.fromMeta) return false; // no mostrar gastos internos de metas
    if(filter==='all') return true;
    if(filter==='income'||filter==='expense') return i.type===filter;
    return i.category===filter;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const catOptions = form.type==='income' ? CATS_INC : getCatsExp();
  const filters = [['all','Todos'],['income','Ingresos'],['expense','Gastos'],['Uber / Cabify','🚗'],['Rappi / PedidosYa','🛵'],['Suscripciones','📱'],['Salud','🌿'],['Freelance','💻'],['Otros','📦']];

  return (
    <div className="fade-in">
      <div className="page-hd">
        <div className="page-title">Movimientos</div>
        <div className="page-sub">{MONTHS[month]} {year} · {items.length} registros</div>
      </div>

      {sum.income>0 && (
        <div className="libre-card" style={{marginBottom:14}}>
          <div className="libre-top">
            <div className="libre-title">Presupuesto libre</div>
            <div className="libre-nums"><strong>{fARS(sum.totalUsadoLibre||sum.varExpNonTDC)}</strong> gastado de {fARS(sum.balance)}</div>
          </div>
          <div className="bar-track">
            <div className="bar-fill" style={{width:`${libreUsedPct}%`,background:barColor}}></div>
          </div>
          <div className="libre-lbls">
            <span>Usado: {libreUsedPct.toFixed(0)}%</span>
            <span style={{fontWeight:700,color:sum.presupuestoLibre>=0?'var(--teal-dark)':'var(--pink-dark)'}}>Restante: {fARS(Math.max(0,sum.presupuestoLibre))}</span>
          </div>
        </div>
      )}

      <div className="list-section">
        <div className="add-row">
          <div className="type-toggle">
            <button className={`type-btn${form.type==='expense'?' on-exp':''}`} onClick={()=>setForm(f=>({...f,type:'expense',category:'Comida'}))}>Gasto</button>
            <button className={`type-btn${form.type==='income'?' on-inc':''}`}  onClick={()=>setForm(f=>({...f,type:'income',category:'Sueldo'}))}>Ingreso</button>
          </div>
          <input className={`add-inp desc${err&&!form.desc?' err':''}`}
            placeholder="Descripción..."
            value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))}
            onKeyDown={e=>e.key==='Enter'&&add()} />
          <input className={`add-inp amt${err&&(!form.amount||parseFloat(form.amount)<=0)?' err':''}`}
            type="number" placeholder="Monto" min="0"
            value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))}
            onKeyDown={e=>e.key==='Enter'&&add()} />
          <CurToggle value={form.currency} onChange={c=>setForm(f=>({...f,currency:c}))} />
          <select className="cat-sel" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
            {catOptions.map(c=><option key={c} value={c}>{CAT_ICON[c]||'📦'} {c}</option>)}
          </select>
          <input className="add-inp sm" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} />
          <button className="add-btn" onClick={add} title="Agregar">+</button>
        </div>

        <div className="filter-bar">
          {filters.map(([v,l])=>(
            <button key={v} className={`fpill${filter===v?' active':''}`} onClick={()=>setFilter(v)}>{l}</button>
          ))}
        </div>

        {filtered.length===0 ? (
          <div className="empty">
            <div className="empty-ico">💸</div>
            <div className="empty-title">Sin movimientos</div>
            <div className="empty-sub">Ingresá gastos o ingresos en el formulario de arriba</div>
          </div>
        ) : filtered.map(item=>(
          editing && editing.id===item.id ? (
            <div key={item.id} className="item-edit-row">
              <input className="add-inp desc" value={editing.desc}
                onChange={e=>setEditing(v=>({...v,desc:e.target.value}))}
                onKeyDown={e=>{if(e.key==='Enter')applyEdit();if(e.key==='Escape')setEditing(null);}} autoFocus />
              <input className="add-inp amt" type="number" value={editing.amount} min="0"
                onChange={e=>setEditing(v=>({...v,amount:e.target.value}))}
                onKeyDown={e=>{if(e.key==='Enter')applyEdit();if(e.key==='Escape')setEditing(null);}} />
              <CurToggle value={editing.currency} onChange={c=>setEditing(v=>({...v,currency:c}))} />
              <select className="cat-sel" value={editing.category} onChange={e=>setEditing(v=>({...v,category:e.target.value}))}>
                {(editing.type==='income'?CATS_INC:getCatsExp()).map(c=><option key={c} value={c}>{getIconForCat(c)} {c}</option>)}
              </select>
              <button className="add-btn" onClick={applyEdit} style={{background:'var(--teal-dark)'}}>✓</button>
              <button className="add-btn" onClick={()=>setEditing(null)} style={{background:'var(--muted)'}}>✕</button>
            </div>
          ) : (
            <div key={item.id} className="list-item">
              <div className="item-ico" style={{background:CAT_BG[item.category]||'#f0ebfc'}}>{getIconForCat(item.category)}</div>
              <div className="item-info">
                <div className="item-name">{item.desc}</div>
                <div className="item-meta">{item.category} · {fmtD(item.date)}</div>
              </div>
              <div className="item-right">
                <CurBadge currency={item.currency} />
                <div className={`item-amt ${item.type}`}>{item.type==='income'?'+':'−'}{fCur(item.amount,item.currency)}</div>
                {item.currency==='USD' && <div className="item-conv">{fARS(item.amount*rate)}</div>}
                <button className="edit-btn" onClick={()=>startEdit(item)} title="Editar">✎</button>
                <DelBtn onClick={()=>del(item.id)} />
              </div>
            </div>
          )
        ))}
      </div>
    </div>
  );
}

/* ── SAVINGS GOALS ── */
function SavingsGoals({ rate }) {
  const [goals,   setGoals]  = useState(()=>gGoals());
  const [form,    setForm]   = useState({name:'',target:'',currency:'ARS'});
  const [depForms,setDep]    = useState({});
  const [editing, setEditing]= useState(null); // {id, name, target, currency}
  const [err,     setErr]    = useState(false);
  const [adjInput, setAdjInput] = useState(null);
  const save       = d => { sGoals(d); setGoals(d); };
  const delGoal    = id => save(goals.filter(g=>g.id!==id));


  // Total across ALL months + manual adjustment
  const [totalCur, setTotalCur] = useState('ARS');
  const rSav = gRateSav();
  const goalBreakdown = goals.map(g=>{ const savedARS=(g.deposits||[]).reduce((s,d)=>s+toARS(d.amount,d.currency,rSav),0); return {name:g.name,currency:g.currency,totalARS:savedARS,totalUSD:savedARS/rSav,totalOwn:g.currency==='USD'?savedARS/rSav:savedARS}; });
  const totalDepositsARS = goalBreakdown.reduce((a,g)=>a+g.totalARS,0);
  // savAdj = ahorros previos en USD (siempre USD)
  const [savAdj, setSavAdj] = useState(()=>parseFloat(ls.getItem('mf_sav_adj')||'0'));
  const savAdjARS = savAdj * rSav;
  const totalARS = totalDepositsARS + savAdjARS;
  const totalCalc = totalCur==='USD' ? totalARS/rSav : totalARS;
  const totalSaved = totalCalc;
  const totalGoals = goals.length;

  const applyAdj = () => {
    const v = parseFloat(String(adjInput).replace(/\./g,'').replace(',','.'));
    if(!isNaN(v) && v>=0){
      // Store as USD always
      const vUSD = totalCur==='USD' ? v : v/rSav;
      ls.setItem('mf_sav_adj', String(vUSD)); setSavAdj(vUSD);
    }
    setAdjInput(null);
  };


  const startEdit = g => setEditing({id:g.id, name:g.name, target:String(g.target), currency:g.currency});
  const applyEdit = () => {
    if(!editing||!editing.name.trim()||!editing.target||parseFloat(editing.target)<=0){ setEditing(null); return; }
    save(goals.map(g=>g.id===editing.id?{...g,name:editing.name.trim(),target:parseFloat(editing.target),currency:editing.currency}:g));
    setEditing(null);
  };

  const addGoal = () => {
    if(!form.name.trim()||!form.target||parseFloat(form.target)<=0){ setErr(true); return; }
    setErr(false);
    save([...goals,{id:uid(),name:form.name.trim(),target:parseFloat(form.target),currency:form.currency,deposits:[]}]);
    setForm({name:'',target:'',currency:'ARS'});
  };

  const addDeposit = (gid, type='dep') => {
    const df = depForms[gid]||{amount:'',currency:'ARS'};
    if(!df.amount||parseFloat(df.amount)<=0) return;
    const amt = type==='ret' ? -parseFloat(df.amount) : parseFloat(df.amount);
    const depDate = String(year)+'-'+String(month+1).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0');
      save(goals.map(g=>g.id===gid?{...g,deposits:[...(g.deposits||[]),{id:uid(),amount:amt,currency:df.currency||'ARS',date:depDate}]}:g));
    setDep(f=>({...f,[gid]:{amount:'',currency:df.currency||'ARS'}}));
  };

  const delDeposit = (gid,did) => save(goals.map(g=>g.id===gid?{...g,deposits:(g.deposits||[]).filter(d=>d.id!==did)}:g));

  return (
    <>
      {goals.length>0 && (
        <div className="total-ahorros-card">
          <div style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
              <div className="ta-label" style={{margin:0}}>Total Ahorros</div>
              <div style={{display:'flex',border:'1.5px solid rgba(255,255,255,0.35)',borderRadius:6,overflow:'hidden'}}>
                <button onClick={()=>setTotalCur('ARS')} style={{background:totalCur==='ARS'?'rgba(255,255,255,0.25)':'transparent',border:'none',color:'white',padding:'2px 8px',fontSize:10,fontWeight:800,cursor:'pointer'}}>ARS</button>
                <button onClick={()=>setTotalCur('USD')} style={{background:totalCur==='USD'?'rgba(255,255,255,0.25)':'transparent',border:'none',color:'white',padding:'2px 8px',fontSize:10,fontWeight:800,cursor:'pointer'}}>USD</button>
              </div>
            </div>
            {adjInput!==null ? (
              <input autoFocus
                style={{background:'rgba(255,255,255,0.2)',border:'none',borderBottom:'2px solid white',color:'white',fontSize:26,fontWeight:900,fontFamily:'var(--font)',outline:'none',width:'160px',padding:'2px 4px'}}
                value={adjInput}
                onChange={e=>setAdjInput(e.target.value)}
                onBlur={applyAdj}
                onKeyDown={e=>{if(e.key==='Enter')applyAdj();if(e.key==='Escape')setAdjInput(null);}}
              />
            ) : (
              <div className="ta-val">{fCur(totalSaved, totalCur)}</div>
            )}
            <div className="ta-sub">
{goalBreakdown.length===0&&<span>acumulado en todas las metas</span>}{goalBreakdown.filter(g=>g.totalARS!==0).map((g,i)=><span key={g.name}>{i>0?' · ':''}{g.name}: {fCur(g.totalOwn,g.currency)}</span>)}
            </div>
          </div>
          <div className="ta-goals" style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
            <div className="ta-goals-count">{totalGoals}</div>
            <div className="ta-goals-lbl">metas activas</div>
            <button onClick={()=>setAdjInput(String(Math.round(totalSaved)))}
              style={{background:'rgba(255,255,255,0.2)',border:'none',borderRadius:6,color:'white',cursor:'pointer',padding:'4px 8px',fontSize:12,fontFamily:'var(--font)',fontWeight:700}}>
              ✎ editar
            </button>
          </div>
        </div>
      )}
      <div className="list-section" style={{marginBottom:16}}>
        <div className="add-row">
          <input className={`add-inp desc${err&&!form.name?' err':''}`}
            placeholder="Nombre de la meta (ej: Vacaciones, Fondo de emergencia...)"
            value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}
            onKeyDown={e=>e.key==='Enter'&&addGoal()} />
          <input className={`add-inp amt${err&&(!form.target||parseFloat(form.target)<=0)?' err':''}`}
            type="number" placeholder="Objetivo" min="0"
            value={form.target} onChange={e=>setForm(f=>({...f,target:e.target.value}))}
            onKeyDown={e=>e.key==='Enter'&&addGoal()} />
          <CurToggle value={form.currency} onChange={c=>setForm(f=>({...f,currency:c}))} />
          <button className="add-btn" onClick={addGoal}>+</button>
        </div>
      </div>

      {goals.length===0 ? (
        <div className="empty">
          <div className="empty-ico">🏦</div>
          <div className="empty-title">Sin metas de ahorro</div>
          <div className="empty-sub">Creá una arriba: vacaciones, fondo de emergencia, compra...</div>
        </div>
      ) : (
        <div className="goals-grid">
          {goals.map(g=>{
            const deps    = g.deposits||[];
            const rSav = gRateSav();
            const savedARS  = deps.reduce((a,d)=>a+toARS(d.amount,d.currency,rSav),0);
            const targetARS = toARS(g.target,g.currency,rSav);
            const pct       = targetARS>0?Math.min((savedARS/targetARS)*100,100):0;
            const dispCur   = (depForms[g.id]||{}).currency||g.currency;
            const savedDisplay  = dispCur==='USD'?savedARS/rSav:savedARS;
            const targetDisplay = dispCur==='USD'?g.target*(g.currency==='USD'?1:1/rSav):targetARS;
            const remainDisplay = Math.max(0,targetDisplay-savedDisplay);
            const df = depForms[g.id]||{amount:'',currency:'ARS'};
            return (
              <div key={g.id} className="goal-card">
                {editing && editing.id===g.id ? (
                  <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
                    <input className="add-inp desc" value={editing.name}
                      onChange={e=>setEditing(v=>({...v,name:e.target.value}))}
                      onKeyDown={e=>{if(e.key==='Enter')applyEdit();if(e.key==='Escape')setEditing(null);}}
                      autoFocus style={{flex:1,minWidth:100}} />
                    <input className="add-inp amt" type="number" value={editing.target} min="0"
                      onChange={e=>setEditing(v=>({...v,target:e.target.value}))}
                      onKeyDown={e=>{if(e.key==='Enter')applyEdit();if(e.key==='Escape')setEditing(null);}} />
                    <CurToggle value={editing.currency} onChange={c=>setEditing(v=>({...v,currency:c}))} />
                    <button className="add-btn" onClick={applyEdit} style={{background:'var(--teal-dark)'}}>✓</button>
                    <button className="add-btn" onClick={()=>setEditing(null)} style={{background:'var(--muted)'}}>✕</button>
                  </div>
                ) : (
                  <div className="goal-top">
                    <div><div className="goal-name">{g.name}</div><div className="goal-target">Objetivo: {fCur(targetDisplay,dispCur)}</div></div>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <div className="goal-pct">{pct.toFixed(0)}%</div>
                      <button className="edit-btn" onClick={()=>startEdit(g)} title="Editar" style={{opacity:.35}}>✎</button>
                      <DelBtn onClick={()=>delGoal(g.id)} />
                    </div>
                  </div>
                )}
                <div className="goal-bar-track"><div className="goal-bar-fill" style={{width:`${pct}%`,background:pct>=100?'var(--teal)':'linear-gradient(90deg,var(--purple),var(--teal))'}}></div></div>
                <div className="goal-legend">
                  <span>Ahorrado: {fCur(savedDisplay,g.currency)}</span>
                  <span>{pct>=100?'✅ Lista':'Falta: '+fCur(remainDisplay,g.currency)}</span>
                </div>
                {deps.length>0 && (
                  <div className="goal-deposits">
                    {[...deps].reverse().slice(0,4).map(d=>(
                      <div key={d.id} className="goal-dep-row">
                        <span className="goal-dep-date">{fmtD(d.date)}</span>
                        <span className="goal-dep-amt" style={{color:d.amount<0?'var(--pink-dark)':'var(--teal-dark)'}}>
                          {d.amount<0?'−':'+' }{fCur(Math.abs(d.amount),d.currency)}
                        </span>
                        <DelBtn onClick={()=>delDeposit(g.id,d.id)} />
                      </div>
                    ))}
                  </div>
                )}
                <div className="goal-add">
                  <input className="add-inp" type="number" placeholder="Monto..." min="0"
                    value={df.amount} onChange={e=>setDep(f=>({...f,[g.id]:{...df,amount:e.target.value}}))}
                    onKeyDown={e=>e.key==='Enter'&&addDeposit(g.id,'dep')} style={{flex:1}} />
                  <CurToggle value={df.currency||'ARS'} onChange={c=>setDep(f=>({...f,[g.id]:{...df,currency:c}}))} />
                  <button className="add-btn" onClick={()=>addDeposit(g.id,'dep')} style={{background:'var(--teal-dark)'}} title="Depositar">+</button>
                  <button className="add-btn" onClick={()=>addDeposit(g.id,'ret')} style={{background:'var(--pink-dark)'}} title="Retirar">−</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}

/* ── SPENDING BUDGETS ── */
function TDCLimitCards({ year, month }) {
  const [limits, setLimits] = useState(()=>gTDCLimits());
  const [editing, setEditing] = useState({});

  const update = (card, val) => {
    const v = parseFloat(String(val).replace(/\./g,'').replace(',','.'));
    if(!isNaN(v) && v>=0) {
      const newLimits = {...limits, [card]: v};
      setLimits(newLimits);
      sTDCLimits(newLimits);
      // Propagar al mes siguiente en gastos fijos
      let nextM = month + 1, nextY = year;
      if(nextM > 11) { nextM = 0; nextY++; }
      const cardNameMap = {naranja:'Naranja', santander:'Santander', galicia:'Galicia'};
      const fx = gFx(nextY, nextM);
      const updated = fx.map(item => {
        const cardKey = Object.keys(cardNameMap).find(k => cardNameMap[k] === item.name);
        if(cardKey) return {...item, amount: newLimits[cardKey]};
        return item;
      });
      sFx(nextY, nextM, updated);
    }
    setEditing(e=>({...e,[card]:false}));
  };

  const cards = [
    {key:'naranja', label:'Naranja', color:'#ff6b2b'},
    {key:'santander', label:'Santander', color:'#ec0000'},
    {key:'galicia', label:'Galicia', color:'#004b8d'},
  ];

  return (
    <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
      {cards.map(({key,label,color})=>(
        <div key={key} style={{flex:1,minWidth:150,background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:12,padding:'12px 14px',display:'flex',flexDirection:'column',gap:6}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div style={{width:10,height:10,borderRadius:'50%',background:color,flexShrink:0}}></div>
            <span style={{fontSize:12,fontWeight:800,color:'var(--ink2)'}}>{label}</span>
          </div>
          {editing[key] ? (
            <input autoFocus
              style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,padding:'4px 8px',fontFamily:'var(--font)',fontSize:14,fontWeight:700,color:'var(--ink)',outline:'none',width:'100%'}}
              defaultValue={limits[key]}
              onBlur={e=>update(key,e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter')update(key,e.target.value);if(e.key==='Escape')setEditing(ed=>({...ed,[key]:false}));}}
            />
          ) : (
            <div onClick={()=>setEditing(e=>({...e,[key]:true}))}
              style={{fontSize:14,fontWeight:700,color:'var(--ink)',cursor:'pointer',padding:'4px 0',borderBottom:'1px dashed var(--border)'}}>
              {fARS(limits[key])}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function SpendingBudgets({ year, month, rate }) {
  const [budgets, setBudgets] = useState(()=>gSpendBdg());
  const [entries, setEntries] = useState(()=>gSpendEnt(year,month));
  const [form,    setForm]    = useState({name:'',limit:'',currency:'ARS'});
  const [entForms,setEntF]    = useState({});  // { budgetId: {amount,currency,note} }
  const [editLimits, setEditL]= useState({});  // { budgetId: string }
  const [err,     setErr]     = useState(false);

  useEffect(()=>{ setEntries(gSpendEnt(year,month)); },[year,month]);

  const saveBdg = d => { sSpendBdg(d); setBudgets(d); };
  const saveEnt = d => { sSpendEnt(year,month,d); setEntries(d); };

  const addBudget = () => {
    if(!form.name.trim()||!form.limit||parseFloat(form.limit)<=0){ setErr(true); return; }
    setErr(false);
    saveBdg([...budgets,{id:uid(),name:form.name.trim(),limit:parseFloat(form.limit),currency:form.currency,tdc:!!form.tdc}]);
    setForm({name:'',limit:'',currency:'ARS',tdc:false});
  };

  const delBudget = id => {
    saveBdg(budgets.filter(b=>b.id!==id));
    saveEnt(entries.filter(e=>e.budgetId!==id));
  };

  const addEntry = bid => {
    const ef = entForms[bid]||{amount:'',currency:'ARS',note:''};
    if(!ef.amount||parseFloat(ef.amount)<=0) return;
    const b = budgets.find(b=>b.id===bid);
    const entId = uid();
    // Use the selected month's date, not today
    const entDate = String(year)+'-'+String(month+1).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0');
    // Save to spend entries
    saveEnt([...entries,{id:entId,budgetId:bid,amount:parseFloat(ef.amount),currency:ef.currency||'ARS',note:ef.note||'',date:entDate}]);
    // Also save to tx so it appears in Movimientos and affects presupuesto libre
    if(b) {
      const txList = gTx(year,month);
      sTx(year,month,[...txList,{id:uid(),type:'expense',desc:b.name,amount:parseFloat(ef.amount),currency:ef.currency||'ARS',category:b.name,date:entDate,fromMeta:entId}]);
    }
    setEntF(f=>({...f,[bid]:{amount:'',currency:ef.currency||'ARS',note:''}}));
  };

  const delEntry = eid => {
    saveEnt(entries.filter(e=>e.id!==eid));
    // Also remove from tx
    const txList = gTx(year,month);
    const newTx = txList.filter(t=>t.fromMeta!==eid);
    if(newTx.length !== txList.length) sTx(year,month,newTx);
  };

  const updateCurrency = (bid, cur) => { saveBdg(budgets.map(b=>b.id===bid?{...b,currency:cur}:b)); };
  const toggleTDC = (bid) => { saveBdg(budgets.map(b=>b.id===bid?{...b,tdc:!b.tdc}:b)); };

  const applyLimit = bid => {
    const v = parseFloat(editLimits[bid]);
    if(!isNaN(v)&&v>0){ saveBdg(budgets.map(b=>b.id===bid?{...b,limit:v}:b)); }
    setEditL(l=>({...l,[bid]:undefined}));
  };

  // TDC calculations
  const tdcBudgets   = gSpendBdg().filter(b=>b.tdc);
  const _tdcLimCards = gTDCLimits();
  const tdcLimit     = _tdcLimCards.naranja + _tdcLimCards.santander + _tdcLimCards.galicia;
  const tdcSpent     = tdcBudgets.reduce((a,b)=>{
    const man = entries.filter(e=>e.budgetId===b.id).reduce((s,e)=>s+toARS(e.amount,e.currency,rate),0);
    const txs = gTx(year,month).filter(t=>t.type==='expense'&&t.category===b.name&&!t.fromMeta).reduce((s,t)=>s+toARS(t.amount,t.currency,rate),0);
    return a+man+txs;
  },0);
  const tdcPct   = tdcLimit>0 ? Math.min((tdcSpent/tdcLimit)*100,100) : 0;
  const tdcColor = tdcPct>=100?'var(--red)':tdcPct>=80?'var(--gold)':'var(--purple)';

  return (
    <>
      <div className="list-section" style={{marginBottom:16}}>
        <div className="add-row">
          <input className={`add-inp desc${err&&!form.name?' err':''}`}
            placeholder="Nueva categoría (ej: Farmacia, Gimnasio...)"
            value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}
            onKeyDown={e=>e.key==='Enter'&&addBudget()} />
          <input className={`add-inp amt${err&&(!form.limit||parseFloat(form.limit)<=0)?' err':''}`}
            type="number" placeholder="Límite mensual" min="0"
            value={form.limit} onChange={e=>setForm(f=>({...f,limit:e.target.value}))}
            onKeyDown={e=>e.key==='Enter'&&addBudget()} />
          <CurToggle value={form.currency} onChange={c=>setForm(f=>({...f,currency:c}))} />
          <button className="add-btn" onClick={addBudget}>+</button>
        </div>
      </div>

      <TDCLimitCards year={year} month={month} />
      <div className="spend-grid">
        {budgets.map(b=>{
          const bEntries = entries.filter(e=>e.budgetId===b.id);
          const bTxRows  = gTx(year,month).filter(t=>t.type==='expense'&&t.category===b.name&&!t.fromMeta).sort((a,b)=>new Date(b.date)-new Date(a.date));
          const txSpent  = bTxRows.reduce((a,t)=>a+toARS(t.amount,t.currency,rate),0);
          const spent    = bEntries.reduce((a,e)=>a+toARS(e.amount,e.currency,rate),0) + txSpent;
          const limit    = toARS(b.limit,b.currency,rate);
          const pct      = limit>0?(spent/limit)*100:0;
          const barColor = pct>100?'var(--red)':'var(--teal-dark)';
          const ef       = entForms[b.id]||{amount:'',currency:'ARS',note:''};
          const limitStr = editLimits[b.id];

          return (
            <div key={b.id} className="spend-card">
              <div className="spend-card-head">
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <button className={`tdc-toggle-btn${b.tdc?' on':''}`} onClick={()=>toggleTDC(b.id)} title={b.tdc?'Quitar de TDC':'Sumar a TDC'}>💳</button>
                  <div className="spend-name">{b.name}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  {limitStr!==undefined ? (
                    <>
                      <input className="add-inp" type="number" style={{width:80,fontSize:12,padding:'4px 8px',textAlign:'right'}}
                        value={limitStr}
                        onChange={e=>setEditL(l=>({...l,[b.id]:e.target.value}))}
                        onBlur={()=>applyLimit(b.id)}
                        onKeyDown={e=>e.key==='Enter'&&applyLimit(b.id)}
                        autoFocus />
                      <CurBadge currency={b.currency} />
                    </>
                  ) : (
                    <>
                      <div className="spend-pct" style={{color:pct>100?'var(--red)':'var(--teal-dark)'}}>{Math.round(pct)}%</div>
                      <button className="edit-btn" style={{opacity:.35}} onClick={()=>setEditL(l=>({...l,[b.id]:String(b.limit)}))} title="Editar límite">✎</button>
                      <DelBtn onClick={()=>delBudget(b.id)} />
                    </>
                  )}
                </div>
              </div>
              <div className="spend-body">
                <div className="spend-bar-track"><div className="spend-bar-fill" style={{width:`${Math.min(pct,100)}%`,background:barColor}}></div></div>
                <div className="spend-legend">
                  <span style={{fontWeight:700,color:pct>100?'var(--red)':'var(--ink)'}}>Gastado: {fARS(spent)}</span>
                  <span style={{color:pct>100?'var(--red)':'var(--muted)'}}>{pct>100?'Excedente: +'+fARS(spent-limit):'Restante: '+fARS(Math.max(0,limit-spent))}</span>
                </div>

                {(bEntries.length>0 || bTxRows.length>0) && (
                  <div className="spend-entries">
                    {[...bEntries].reverse().slice(0,5).map(e=>(
                      <div key={e.id} className="spend-ent-row">
                        <span className="spend-ent-note">{e.note||'—'}</span>
                        <span className="spend-ent-date">{fmtD(e.date)}</span>
                        <span className="spend-ent-amt">−{fCur(e.amount,e.currency)}</span>
                        <DelBtn onClick={()=>delEntry(e.id)} />
                      </div>
                    ))}
                    {bTxRows.slice(0,5).map(t=>(
                      <div key={t.id} className="spend-ent-row">
                        <span className="spend-ent-note">{t.desc}</span>
                        <span className="spend-ent-date">{fmtD(t.date)}</span>
                        <span className="spend-ent-amt">−{fCur(t.amount,t.currency)}</span>
                      </div>
                    ))}
                  </div>
                )}

                <div className="spend-add">
                  <input className="add-inp" type="number" placeholder="Monto" min="0"
                    value={ef.amount} style={{width:80}}
                    onChange={e=>setEntF(f=>({...f,[b.id]:{...ef,amount:e.target.value}}))}
                    onKeyDown={e=>e.key==='Enter'&&addEntry(b.id)} />

                  <CurToggle value={ef.currency||'ARS'} onChange={c=>setEntF(f=>({...f,[b.id]:{...ef,currency:c}}))} />
                  <button className="add-btn" onClick={()=>addEntry(b.id)} style={{background:'var(--pink-dark)'}}>+</button>
                </div>
              </div>
                <div style={{fontSize:11,color:'var(--muted)',fontWeight:600,marginBottom:6,textAlign:'center'}}>Límite: {fCur(b.limit,b.currency)}</div>
            </div>
          );
        })}
      </div>
    </>
  );
}

/* ── METAS TAB ── */
function MetasTab({ year, month, rate }) {
  const [mode, setMode] = useState('gastos');
  const [tick, setTick] = useState(0);
  useEffect(()=>{ const h=()=>setTick(t=>t+1); window.addEventListener('data-updated',h); return()=>window.removeEventListener('data-updated',h); },[]);
  const budgets = gSpendBdg();
  const entries = gSpendEnt(year, month);
  const goals   = gGoals();

  const spendItems = budgets.map(b => {
    const manual = entries.filter(e=>e.budgetId===b.id).reduce((a,e)=>a+toARS(e.amount,e.currency,rate),0);
    const txs    = gTx(year,month).filter(t=>t.type==='expense'&&t.category===b.name&&!t.fromMeta).reduce((a,t)=>a+toARS(t.amount,t.currency,rate),0);
    const spent  = manual + txs;
    const limit  = toARS(b.limit, b.currency, rate);
    const pct    = limit>0 ? (spent/limit)*100 : 0;
    return { id:b.id, name:b.name, tdc:b.tdc, pct, over: pct>100 };
  });

  const saveItems = goals.map(g => {
    const saved  = (g.deposits||[]).reduce((a,d)=>a+toARS(d.amount,d.currency,rate),0);
    const target = toARS(g.target, g.currency, rate);
    const pct    = target>0 ? Math.min((saved/target)*100,100) : 0;
    return { id:g.id, name:g.name, pct };
  });

  const allItems = [...spendItems];

  return (
    <div className="fade-in">
      <div className="page-hd">
        <div className="page-title">Metas</div>
        <div className="page-sub">Presupuestos de gasto y metas de ahorro</div>
      </div>

      <div className="meta-toggle">
        <button className={`meta-btn${mode==='gastos'?' active':''}`} onClick={()=>setMode('gastos')}>💳 Presupuestos</button>
        <button className={`meta-btn${mode==='ahorro'?' active':''}`} onClick={()=>setMode('ahorro')}>🏦 Ahorro</button>
      </div>

      {mode==='gastos' && (() => {
        const totalLimit  = budgets.reduce((a,b)=>a+toARS(b.limit,b.currency,rate),0);
        const totalSpent  = budgets.reduce((a,b)=>{
          const manual = entries.filter(e=>e.budgetId===b.id).reduce((s,e)=>s+toARS(e.amount,e.currency,rate),0);
          const txs    = gTx(year,month).filter(t=>t.type==='expense'&&t.category===b.name&&!t.fromMeta).reduce((s,t)=>s+toARS(t.amount,t.currency,rate),0);
          return a+manual+txs;
        },0);
        const totalSaved  = goals.reduce((a,g)=>{
          return a+(g.deposits||[]).reduce((s,d)=>s+toARS(d.amount,d.currency,rate),0);
        },0);
        const totalTarget = goals.reduce((a,g)=>a+toARS(g.target,g.currency,rate),0);
        const totalPct    = totalLimit>0 ? (totalSpent/totalLimit)*100 : 0;
        const savePct     = totalTarget>0 ? Math.min((totalSaved/totalTarget)*100,100) : 0;
        const freshEnts = gSpendEnt(year,month);
        const freshTx   = gTx(year,month);
        const tdcBdgs  = budgets.filter(b=>b.tdc);
        const tdcCards = gTDCLimits();
        const tdcLim   = tdcCards.naranja + tdcCards.santander + tdcCards.galicia;
        const tdcSpt   = tdcBdgs.reduce((a,b)=>{ const man=freshEnts.filter(e=>e.budgetId===b.id).reduce((s,e)=>s+toARS(e.amount,e.currency,rate),0); const txs=freshTx.filter(t=>t.type==='expense'&&t.category===b.name&&!t.fromMeta).reduce((s,t)=>s+toARS(t.amount,t.currency,rate),0); return a+man+txs; },0);
        const tdcP = tdcLim>0?Math.min((tdcSpt/tdcLim)*100,100):tdcBdgs.length>0?0:-1;
        const pesosBdgs = budgets.filter(b=>!b.tdc);
        const pesosLim  = pesosBdgs.reduce((a,b)=>a+toARS(b.limit,b.currency,rate),0);
        const pesosSpt  = pesosBdgs.reduce((a,b)=>{ const man=freshEnts.filter(e=>e.budgetId===b.id).reduce((s,e)=>s+toARS(e.amount,e.currency,rate),0); const txs=freshTx.filter(t=>t.type==='expense'&&t.category===b.name&&!t.fromMeta).reduce((s,t)=>s+toARS(t.amount,t.currency,rate),0); return a+man+txs; },0);
        const pesosP = pesosLim>0?Math.min((pesosSpt/pesosLim)*100,100):pesosBdgs.length>0?0:-1;

        return (
          <div className="metas-summary">
            {/* Total acumulado */}

                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <span style={{fontSize:12,fontWeight:800,color:'var(--ink)'}}>Total presupuestos</span>
                  <span style={{fontSize:13,fontWeight:900,color:totalPct>100?'var(--red)':'var(--purple-dark)'}}>{Math.round(totalPct)}%</span>
                </div>
                <div className="metas-summary-bar" style={{height:10}}>
                  <div className="metas-summary-fill" style={{width:`${Math.min(totalPct,100)}%`,background:totalPct>100?'var(--red)':'var(--pink)'}}></div>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--muted)',fontWeight:600,marginTop:4}}>
                  <span>Gastado: {fARS(totalSpent)}</span>
                  <span>Límite: {fARS(totalLimit)}</span>
                </div>
              </div>
            )}
            {tdcP>=0 && (
              <div style={{paddingBottom:8,marginBottom:4,borderBottom:'1px solid var(--border)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                  <div className="metas-summary-name" style={{fontWeight:800,color:'var(--purple-dark)'}}>💳 TDC</div>
                  <div style={{fontSize:11,fontFamily:'var(--font-mono,monospace)',color:tdcP>=100?'var(--pink-dark)':tdcP>=80?'var(--gold)':'var(--purple-dark)',fontWeight:700}}>
                    {fARS(tdcSpt)} <span style={{color:'var(--muted)',fontWeight:400}}>de {tdcLim>0?fARS(tdcLim):'sin límite'}</span> · {tdcP.toFixed(0)}%
                  </div>
                </div>
                <div className="metas-summary-bar"><div className="metas-summary-fill" style={{width:Math.min(tdcP,100)+'%',background:tdcP>=100?'var(--red)':tdcP>=80?'var(--gold)':'var(--purple-dark)'}}></div></div>
              </div>
            )}
            {pesosP>=0 && (
              <div style={{paddingBottom:8,marginBottom:4,borderBottom:'1px solid var(--border)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                  <div className="metas-summary-name" style={{fontWeight:800,color:'var(--teal-dark)'}}>💵 Pesos del mes</div>
                  <div style={{fontSize:11,fontFamily:'var(--font-mono,monospace)',color:pesosP>=100?'var(--pink-dark)':pesosP>=80?'var(--gold)':'var(--teal-dark)',fontWeight:700}}>
                    {fARS(pesosSpt)} <span style={{color:'var(--muted)',fontWeight:400}}>de {fARS(pesosLim)}</span> · {pesosP.toFixed(0)}%
                  </div>
                </div>
                <div className="metas-summary-bar"><div className="metas-summary-fill" style={{width:Math.min(pesosP,100)+'%',background:pesosP>=100?'var(--red)':pesosP>=80?'var(--gold)':'var(--teal-dark)'}}></div></div>
              </div>
            )}
            {allItems.map(item=>(
              <div key={item.id} className="metas-summary-row">
                <div className="metas-summary-name">{item.name}</div>
                <div className="metas-summary-bar">
                  <div className="metas-summary-fill" style={{
                    width:`${Math.min(item.pct,100)}%`,
                    background: item.pct>100 ? 'var(--red)' : 'var(--teal-dark)'
                  }}></div>
                </div>
                <div className="metas-summary-pct" style={{color:item.pct>100?'var(--red)':'var(--teal-dark)'}}>{Math.round(item.pct)}%</div>
              </div>
            ))}
          </div>
        );
      })()}

      {mode==='gastos'
        ? <SpendingBudgets year={year} month={month} rate={rate} />
        : <SavingsGoals rate={rate} />}
    </div>
  );
}

/* ── STATS TAB ── */
function StatsTab({ year, month, rate }) {
  const donutRef = useRef(null);
  const lineRef  = useRef(null);
  const hbarRef  = useRef(null);
  const tdcRef   = useRef(null);
  const charts   = useRef({});

  const { income, fijos, varExp, libre, balance } = calcSummary(year,month,rate);
  const savingRate = income>0 ? ((balance/income)*100).toFixed(1) : 0;

  useEffect(()=>{
    Object.values(charts.current).forEach(c=>{try{c.destroy();}catch{}});
    charts.current={};

    const tx    = gTx(year,month);
    const fx    = gFx(year,month);
    const bdgs  = gSpendBdg();
    const ents  = gSpendEnt(year,month);

    const bycat = {};
    // Variable expenses from Movimientos (exclude fromMeta)
    tx.filter(t=>t.type==='expense'&&!t.fromMeta).forEach(t=>{ bycat[t.category]=(bycat[t.category]||0)+toARS(t.amount,t.currency,rate); });
    // Fixed expenses from Gastos Fijos
    fx.forEach(f=>{ bycat[f.category]=(bycat[f.category]||0)+toARS(f.amount,f.currency,rate); });
    const catE = Object.entries(bycat).sort((a,b)=>b[1]-a[1]);

    // TDC breakdown from metas entries
    const tdcCats = bdgs.filter(b=>b.tdc).map(b=>b.name);
    const bytdc = {};
    ents.forEach(e=>{ const b=bdgs.find(b=>b.id===e.budgetId); if(!b) return; const k=b.name; bytdc[k]=(bytdc[k]||0)+toARS(e.amount,e.currency,rate); });
    const tdcE = Object.entries(bytdc).sort((a,b)=>b[1]-a[1]);

    const months6=[],inc6=[],exp6=[];
    for(let i=5;i>=0;i--){
      const d=new Date(year,month-i,1);
      months6.push(MONTHS[d.getMonth()].slice(0,3));
      const s=calcSummary(d.getFullYear(),d.getMonth(),rate);
      inc6.push(s.income); exp6.push(s.fijos+s.varExp);
    }

    const tickColor='#a08ab0', gridColor='rgba(176,143,200,0.09)';
    const scaleOpts = {
      x:{ticks:{color:tickColor,font:{family:'Outfit'}},grid:{color:gridColor}},
      y:{ticks:{color:tickColor,font:{family:'Outfit'},callback:v=>'$'+(v/1000).toFixed(0)+'k'},grid:{color:gridColor}}
    };

    if(donutRef.current && catE.length>0){
      charts.current.donut = new Chart(donutRef.current,{
        type:'doughnut',
        data:{labels:catE.map(([c])=>c),datasets:[{data:catE.map(([,v])=>v),backgroundColor:catE.map(([c])=>CAT_COLOR[c]||'#ccc'),borderWidth:3,borderColor:'#fff'}]},
        options:{plugins:{legend:{position:'bottom',labels:{color:'#5a4468',font:{family:'Outfit',size:11},padding:10}}},cutout:'65%'}
      });
    }
    if(lineRef.current){
      charts.current.line = new Chart(lineRef.current,{
        type:'line',
        data:{labels:months6,datasets:[
          {label:'Ingresos',data:inc6,borderColor:'#7dd3d8',backgroundColor:'rgba(125,211,216,0.07)',tension:.4,fill:true,pointBackgroundColor:'#7dd3d8',pointRadius:4},
          {label:'Gastos',  data:exp6,borderColor:'#f4a7c3',backgroundColor:'rgba(244,167,195,0.07)',tension:.4,fill:true,pointBackgroundColor:'#f4a7c3',pointRadius:4}
        ]},
        options:{plugins:{legend:{labels:{color:'#a08ab0',font:{family:'Outfit',size:11}}}},scales:scaleOpts}
      });
    }
    if(hbarRef.current && catE.length>0){
      charts.current.hbar = new Chart(hbarRef.current,{
        type:'bar',
        data:{labels:catE.map(([c])=>(CAT_ICON[c]||'📦')+' '+c),datasets:[{data:catE.map(([,v])=>v),backgroundColor:catE.map(([c])=>CAT_COLOR[c]||'#ccc'),borderRadius:8,borderSkipped:false}]},
        options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{
          x:{ticks:{color:tickColor,font:{family:'Outfit'},callback:v=>'$'+(v/1000).toFixed(0)+'k'},grid:{color:gridColor}},
          y:{ticks:{color:'#5a4468',font:{family:'Outfit',size:12,weight:'600'}},grid:{display:false}}
        }}
      });
    }
    if(tdcRef.current && tdcE.length>0){
      const tdcColors = ['#7c6af7','#e8615a','#f0c05a','#5ec98a','#f4a7c3','#7dd3d8','#f9c784','#b09fdc','#98d4b0','#c8a87e'];
      charts.current.tdc = new Chart(tdcRef.current,{
        type:'doughnut',
        data:{labels:tdcE.map(([c])=>c),datasets:[{data:tdcE.map(([,v])=>v),backgroundColor:tdcE.map((_,i)=>tdcColors[i%tdcColors.length]),borderWidth:3,borderColor:'#fff'}]},
        options:{plugins:{legend:{position:'right',labels:{color:'#3a2a50',font:{family:'Outfit',size:12,weight:'600'},padding:14}}},cutout:'55%'}
      });
    }
    return ()=>Object.values(charts.current).forEach(c=>{try{c.destroy();}catch{}});
  },[year,month,rate]);

  const tx    = gTx(year,month);
  const fx2   = gFx(year,month);
  const bdgs2 = gSpendBdg();
  const ents2 = gSpendEnt(year,month);
  const bycat = {};
  tx.filter(t=>t.type==='expense').forEach(t=>{ bycat[t.category]=(bycat[t.category]||0)+toARS(t.amount,t.currency,rate); });
  fx2.forEach(f=>{ bycat[f.category]=(bycat[f.category]||0)+toARS(f.amount,f.currency,rate); });
  ents2.forEach(e=>{ const b=bdgs2.find(b=>b.id===e.budgetId); const k=b?b.name:'Otros'; bycat[k]=(bycat[k]||0)+toARS(e.amount,e.currency,rate); });
  const topCat = Object.entries(bycat).sort((a,b)=>b[1]-a[1])[0];

  return (
    <div className="fade-in">
      <div className="page-hd">
        <div className="page-title">Estadísticas</div>
        <div className="page-sub">{MONTHS[month]} {year}</div>
      </div>

      <div className="cards-row three">
        <div className="stat-card">
          <div className="sc-lbl">Tasa de ahorro</div>
          <div className="sc-val" style={{color:savingRate>=20?'var(--teal-dark)':savingRate>=10?'var(--gold)':'var(--pink-dark)'}}>{savingRate}%</div>
          <div className="sc-sub">{savingRate>=20?'Excelente':savingRate>=10?'Buen nivel':'Meta recomendada: 20%'}</div>
        </div>
        <div className="stat-card">
          <div className="sc-lbl">Mayor categoría</div>
          <div className="sc-val" style={{fontSize:16,color:'var(--ink)'}}>{topCat?(CAT_ICON[topCat[0]]||'📦')+' '+topCat[0]:'–'}</div>
          <div className="sc-sub">{topCat?fARS(topCat[1]):'sin datos'}</div>
        </div>
        <div className="stat-card">
          <div className="sc-lbl">Balance mes</div>
          <div className={`sc-val ${balance>=0?'pos':'neg'}`}>{balance<0?'−':''}{fARS(balance)}</div>
          <div className="sc-sub">{balance>=0?'disponible':'negativo'}</div>
        </div>
      </div>

      <div className="charts-grid">
        <div className="chart-card">
          <div className="chart-title">Gastos por categoría</div>
          {Object.keys(bycat).length>0
            ? <canvas ref={donutRef}></canvas>
            : <div className="chart-empty">Sin gastos aún</div>}
        </div>
        <div className="chart-card">
          <div className="chart-title">Ingresos vs Gastos · 6 meses</div>
          <canvas ref={lineRef}></canvas>
        </div>
      </div>

      {Object.keys(bycat).length>0 && (
        <div className="chart-card">
          <div className="chart-title">Detalle de gastos este mes</div>
          <canvas ref={hbarRef} style={{maxHeight:240}}></canvas>
        </div>
      )}

      <div style={{marginTop:16}}>
        <div className="chart-card">
          <div className="chart-title">Desglose por gastos particulares</div>
          <canvas ref={tdcRef} style={{maxHeight:320}}></canvas>
        </div>
      </div>
    </div>
  );
}

/* ── APP ROOT ── */
const THEMES = {
  rosa:    { '--purple-dark':'#7a60c0', '--pink-dark':'#c9608a', '--teal-dark':'#3da8ae', '--sidebar-a':'#e8d5f4', '--sidebar-b':'#c6edf2' },
  purpura: { '--purple-dark':'#5c42b0', '--pink-dark':'#8860c8', '--teal-dark':'#7060c0', '--sidebar-a':'#ddd5f8', '--sidebar-b':'#cac0f0' },
  menta:   { '--purple-dark':'#2a9d8f', '--pink-dark':'#3a9d7a', '--teal-dark':'#1a8060', '--sidebar-a':'#c6ede8', '--sidebar-b':'#c6f0e0' },
  noche:   { '--purple-dark':'#9a80e0', '--pink-dark':'#e070a0', '--teal-dark':'#40b8c0', '--sidebar-a':'#2a1f38', '--sidebar-b':'#1a2a38' },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "colorTheme": "noche",
  "density": "compacto",
  "showConversion": true,
  "sidebarGradient": true
}/*EDITMODE-END*/;

function App() {
  const now = new Date();
  const [tab,   setTab]   = useState('overview');
  const [year,  setYear]  = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [rate,  setRate]  = useState(gRate);
  const [refreshKey, setRefreshKey] = useState(0);

  useEffect(()=>{
    const handler = () => setRefreshKey(k=>k+1);
    window.addEventListener('data-updated', handler);
    return ()=>window.removeEventListener('data-updated', handler);
  },[]);

  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply theme
  useEffect(()=>{
    const allVars=['--bg','--surface','--surface2','--border','--ink','--ink2','--muted','--purple-dark','--pink-dark','--teal-dark','--sidebar-a','--sidebar-b'];
    allVars.forEach(k=>document.documentElement.style.removeProperty(k));
    const t = THEMES[tweaks.colorTheme] || THEMES.rosa;
    Object.entries(t).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
  }, [tweaks.colorTheme]);

  // Apply sidebar style
  useEffect(()=>{
    const el = document.querySelector('.sidebar');
    if(!el) return;
    if(!tweaks.sidebarGradient){
      el.style.background = 'white';
    } else {
      el.style.background = '';
    }
  }, [tweaks.sidebarGradient]);

  // Apply density + conversion classes to shell
  const shellClass = [
    'shell',
    tweaks.density==='compacto' ? 'compact' : '',
    !tweaks.showConversion ? 'hide-conv' : '',
  ].filter(Boolean).join(' ');

  const prevMonth = () => { if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth = () => { if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };

  const content = {
    overview:    <ResumenTab     key={refreshKey} year={year} month={month} rate={rate} />,
    fijos:       <FijosTab       key={refreshKey} year={year} month={month} rate={rate} />,
    movimientos: <MovimientosTab key={refreshKey} year={year} month={month} rate={rate} />,
    metas:       <MetasTab       year={year} month={month} rate={rate} />,
    stats:       <StatsTab       key={refreshKey} year={year} month={month} rate={rate} />,
  }[tab];

  const [mobileMenu, setMobileMenu] = useState(false);
  const sum = calcSummary(year, month, rate);

  return (
    <div className={shellClass}>

      {/* MOBILE TOP BAR */}
      <div className="mobile-top">
        <div className="mobile-top-left">
          <div className="mobile-logo">Mis <em>Finanzas</em></div>
          <div className="mobile-balance" style={{color:sum.presupuestoLibre>=0?'var(--purple-dark)':'var(--pink-dark)',fontSize:12,fontWeight:800}}>
            {sum.presupuestoLibre>=0?'':'-'}${Math.abs(sum.presupuestoLibre).toLocaleString('es-AR',{maximumFractionDigits:0})}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div className="mobile-month">
            <button onClick={prevMonth}>‹</button>
            <span>{MONTHS[month].slice(0,3)} {year}</span>
            <button onClick={nextMonth}>›</button>
          </div>
          <button className="mobile-menu-btn" onClick={()=>setMobileMenu(true)}>⚙️</button>
        </div>
      </div>

      {/* MOBILE MENU */}
      {mobileMenu && (
        <div className="mobile-menu-overlay open" onClick={()=>setMobileMenu(false)}>
          <div className="mobile-menu-panel" onClick={e=>e.stopPropagation()}>
            <button className="mobile-menu-close" onClick={()=>setMobileMenu(false)}>✕ Cerrar</button>
            <div className="mobile-menu-title">Tipos de cambio</div>
            <SidebarRateRow label="USD general" storageKey="mf_rate" onUpdate={v=>{sRate(v);setRate(v);}} />
            <SidebarRateRow label="Aporte Mamá" storageKey="mf_rate_mami" />
            <SidebarRateRow label="Ahorros" storageKey="mf_rate_sav" />
            <div className="mobile-menu-title" style={{marginTop:8}}>Datos</div>
            <button onClick={()=>{exportData();setMobileMenu(false);}} style={{background:'rgba(255,255,255,0.65)',border:'1px solid rgba(255,255,255,0.9)',borderRadius:8,padding:'10px',fontFamily:'var(--font)',fontSize:13,fontWeight:700,color:'var(--ink2)',cursor:'pointer'}}>💾 Guardar datos</button>
            <label style={{background:'rgba(255,255,255,0.65)',border:'1px solid rgba(255,255,255,0.9)',borderRadius:8,padding:'10px',fontFamily:'var(--font)',fontSize:13,fontWeight:700,color:'var(--ink2)',cursor:'pointer',textAlign:'center',display:'block'}}>
              📂 Cargar datos<input type="file" accept=".json" style={{display:'none'}} onChange={e=>{if(e.target.files[0]){importData(e.target.files[0]);setMobileMenu(false);}}} />
            </label>
            <button onClick={()=>{if(!popUndo())alert('Sin cambios para deshacer');setMobileMenu(false);}} style={{background:'rgba(255,255,255,0.45)',border:'1px solid rgba(255,255,255,0.7)',borderRadius:8,padding:'10px',fontFamily:'var(--font)',fontSize:13,fontWeight:700,color:'var(--ink2)',cursor:'pointer'}}>↩ Deshacer</button>
          </div>
        </div>
      )}

      <Sidebar
        tab={tab} setTab={setTab}
        year={year} month={month}
        onPrev={prevMonth} onNext={nextMonth}
        rate={rate} setRate={setRate}
      />
      <main className="main">{content}</main>

      {/* MOBILE BOTTOM NAV */}
      <nav className="mobile-nav">
        {[['overview','🏠','Resumen'],['fijos','📌','Fijos'],['movimientos','💸','Movim.'],['metas','🎯','Metas'],['stats','📊','Stats']].map(([t,ico,lbl])=>(
          <button key={t} className={'mobile-nav-btn'+(tab===t?' active':'')} onClick={()=>setTab(t)}>
            <span className="mico">{ico}</span>
            <span className="mlbl">{lbl}</span>
          </button>
        ))}
      </nav>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Visual">
          <TweakRadio  label="Tema"      id="colorTheme"    value={tweaks.colorTheme}    onChange={v=>setTweak('colorTheme',v)}    options={[{value:'rosa',label:'Rosa'},{value:'purpura',label:'Púrpura'},{value:'menta',label:'Menta'},{value:'noche',label:'Noche'}]} />
          <TweakRadio  label="Densidad"  id="density"       value={tweaks.density}       onChange={v=>setTweak('density',v)}       options={[{value:'comodo',label:'Normal'},{value:'compacto',label:'Compacto'}]} />
          <TweakToggle label="Sidebar con gradiente" id="sidebarGradient" value={tweaks.sidebarGradient} onChange={v=>setTweak('sidebarGradient',v)} />
        </TweakSection>
        <TweakSection label="Datos">
          <TweakToggle label="Mostrar conversión ARS" id="showConversion" value={tweaks.showConversion} onChange={v=>setTweak('showConversion',v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

  background_color: "#fdf6fb",

    {
      src: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#e8d5f4"/><text x="50%" y="58%" font-size="110" text-anchor="middle" dominant-baseline="middle">💰</text></svg>'),
      sizes: "192x192",
      type: "image/svg+xml"
    }
  ]
};

const manifestURL = URL.createObjectURL(blob);

// ── SERVICE WORKER ──
if('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(()=>new Response(''))));
  `;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swURL = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL).catch(()=>{});
}
