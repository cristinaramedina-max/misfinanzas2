<script type="text/babel">

// tweaks-panel.jsx
// Reusable Tweaks shell + form-control helpers.
//
// Owns the host protocol (listens for __activate_edit_mode / __deactivate_edit_mode,
// posts __edit_mode_available / __edit_mode_set_keys / __edit_mode_dismissed) so
// individual prototypes don't re-roll it. Ships a consistent set of controls so you
// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):
//
//   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
//     "primaryColor": "#D97757",
//     "fontSize": 16,
//     "density": "regular",
//     "dark": false

//           <TweakSection label="Typography" />
//           <TweakSlider label="Font size" value={t.fontSize} min={10} max={32} unit="px"
//                        onChange={(v) => setTweak('fontSize', v)} />
//           <TweakRadio  label="Density" value={t.density}
//                        options={['compact', 'regular', 'comfy']}
//                        onChange={(v) => setTweak('density', v)} />
//           <TweakSection label="Theme" />
//           <TweakColor  label="Primary" value={t.primaryColor}
//                        onChange={(v) => setTweak('primaryColor', v)} />
//           <TweakToggle label="Dark mode" value={t.dark}
//                        onChange={(v) => setTweak('dark', v)} />
//         </TweaksPanel>
//       </div>
//     );
//   }
//
// ─────────────────────────────────────────────────────────────────────────────

    width:14px;height:14px;border-radius:50%;background:#fff;

    background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}

    background:rgba(0,0,0,.06);user-select:none}

    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}

  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;
    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;
    background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

.month-nav .mlabel { color: var(--ink); font-size: 12px; font-weight: 700; flex: 1; text-align: center; }

.nav-menu { flex: 1; padding: 4px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: var(--r-sm); cursor: pointer; color: var(--ink2); font-size: 13px; font-weight: 600; transition: all .15s; border: none; background: none; width: 100%; text-align: left; font-family: var(--font); }
.nav-item:hover { background: rgba(255,255,255,0.5); }
.nav-item.active { background: white; color: var(--ink); box-shadow: var(--shadow-sm); }
.nav-icon { font-size: 14px; }

.sidebar-bottom { padding: 10px 12px 18px; display: flex; flex-direction: column; gap: 8px; }
.sb-balance { background: rgba(255,255,255,0.65); border: 1px solid rgba(255,255,255,0.9); border-radius: var(--r-sm); padding: 12px 14px; }
.sb-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 3px; font-weight: 700; }
.sb-val { font-size: 21px; font-weight: 800; line-height: 1; }
.sb-val.pos { color: var(--teal-dark); }
.sb-val.neg { color: var(--pink-dark); }
.sb-sub { font-size: 10px; color: var(--muted); margin-top: 3px; font-weight: 500; }
.rate-row { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.5); border-radius: 8px; padding: 7px 10px; border: 1px solid rgba(255,255,255,0.82); }
.rate-lbl { font-size: 10px; color: var(--muted); font-weight: 600; flex-shrink: 0; }
.rate-inp { border: none; background: none; font-family: var(--font); font-size: 13px; font-weight: 800; color: var(--usd-dark); flex: 1; min-width: 0; text-align: right; outline: none; }

/* ── MAIN ── */
.main { flex: 1; overflow-y: auto; padding: 26px 26px 52px; min-width: 0; }
.page-hd { margin-bottom: 18px; }
.page-title { font-size: 23px; font-weight: 900; letter-spacing: -0.3px; }
.page-sub { color: var(--muted); font-size: 12px; margin-top: 3px; font-weight: 500; }

/* ── STAT CARDS ── */
.cards-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
.cards-row.three { grid-template-columns: repeat(3,1fr); }
.stat-card { background: var(--surface); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.sc-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; font-weight: 700; }
.sc-val { font-size: 21px; font-weight: 800; line-height: 1.1; }
.sc-val.income { color: var(--teal-dark); }
.sc-val.expense { color: var(--pink-dark); }
.sc-val.libre { color: var(--purple-dark); }
.sc-val.pos { color: var(--teal-dark); }
.sc-val.neg { color: var(--pink-dark); }
.sc-val.usd { color: var(--usd-dark); }
.sc-sub { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 500; }

/* ── LIBRE PROGRESS ── */
.libre-card { background: var(--surface); border-radius: var(--r); padding: 18px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.libre-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.libre-title { font-size: 13px; font-weight: 700; }
.libre-nums { font-size: 12px; color: var(--muted); font-weight: 600; }
.libre-nums strong { color: var(--ink); font-weight: 800; }
.bar-track { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .55s cubic-bezier(.34,1.2,.64,1); }
.libre-lbls { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; font-weight: 500; }

/* ── USD SUMMARY STRIP ── */
.usd-strip { background: var(--usd-light); border: 1px solid rgba(31,138,112,0.2); border-radius: var(--r); padding: 14px 18px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
.usd-item {}
.usd-item .sc-lbl { color: var(--usd-dark); opacity: .7; }
.usd-item .sc-val { font-size: 18px; color: var(--usd-dark); }

/* ── LIST SECTION ── */
.list-section { background: var(--surface); border-radius: var(--r); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 16px; }
.list-hd { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.list-hd-title { font-size: 12px; font-weight: 700; color: var(--ink2); }
.list-hd-meta { font-size: 11px; color: var(--muted); font-weight: 600; }

/* ── INLINE ADD ROW ── */
.add-row { display: flex; align-items: center; gap: 7px; padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--surface2); flex-wrap: wrap; }
.add-inp { background: white; border: 1.5px solid var(--border); color: var(--ink); padding: 7px 10px; border-radius: 7px; font-family: var(--font); font-size: 13px; font-weight: 500; outline: none; transition: border-color .15s; min-width: 0; }
.add-inp:focus { border-color: var(--purple); }
.add-inp.desc { flex: 1; min-width: 110px; }
.add-inp.amt { width: 96px; text-align: right; }
.add-inp.sm { width: 76px; }
.add-inp.err { border-color: var(--pink) !important; }

/* ── CURRENCY TOGGLE ── */
.cur-toggle { display: flex; border: 1.5px solid var(--border); border-radius: 7px; overflow: hidden; flex-shrink: 0; }
.cur-btn { background: white; border: none; padding: 6px 9px; font-family: var(--font); font-size: 11px; font-weight: 800; cursor: pointer; color: var(--muted); transition: all .15s; letter-spacing: 0.3px; }
.cur-btn.on { background: var(--purple-light); color: var(--purple-dark); }
.cur-btn.on.usd { background: var(--usd-light); color: var(--usd-dark); }

/* ── TYPE TOGGLE ── */
.type-toggle { display: flex; border: 1.5px solid var(--border); border-radius: 7px; overflow: hidden; flex-shrink: 0; }
.type-btn { background: white; border: none; padding: 6px 10px; font-family: var(--font); font-size: 11px; font-weight: 800; cursor: pointer; color: var(--muted); transition: all .15s; }
.type-btn.on-exp { background: var(--pink-light); color: var(--pink-dark); }
.type-btn.on-inc { background: var(--teal-light); color: var(--teal-dark); }

.cat-sel { background: white; border: 1.5px solid var(--border); color: var(--ink2); padding: 7px 8px; border-radius: 7px; font-family: var(--font); font-size: 12px; font-weight: 600; outline: none; cursor: pointer; transition: border-color .15s; flex-shrink: 0; }
.cat-sel:focus { border-color: var(--purple); }

.add-btn { background: var(--purple-dark); color: white; border: none; width: 30px; height: 30px; border-radius: 7px; cursor: pointer; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; font-family: var(--font); }
.add-btn:hover { background: var(--pink-dark); transform: scale(1.05); }
.add-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

/* ── LIST ITEMS ── */
.list-item { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-bottom: 1px solid var(--border); transition: background .12s; }
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: var(--surface2); }
.item-ico { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500; }
.item-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.item-amt { font-size: 14px; font-weight: 800; }
.item-amt.expense { color: var(--pink-dark); }
.item-amt.income { color: var(--teal-dark); }
.item-amt.usd { color: var(--usd-dark); }
.item-conv { font-size: 10px; color: var(--muted); font-weight: 600; }
.del-btn { background: none; border: none; color: var(--muted); cursor: pointer; width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all .15s; opacity: 0; font-family: var(--font); }
.list-item:hover .del-btn { opacity: 1; }
.del-btn:hover { background: var(--red-light); color: var(--pink-dark); opacity: 1; }

.paid-btn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all .15s; flex-shrink: 0; font-family: var(--font); }
.paid-btn.paid { background: var(--green-light); border-color: var(--green); }
.paid-btn:not(.paid):hover { border-color: var(--teal); }

.cur-badge { font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 4px; letter-spacing: 0.5px; flex-shrink: 0; }
.cur-badge.ars { background: var(--purple-light); color: var(--purple-dark); }
.cur-badge.usd { background: var(--usd-light); color: var(--usd-dark); }

/* ── FILTER PILLS ── */
.filter-bar { padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 5px; flex-wrap: wrap; background: var(--surface2); }
.fpill { background: white; border: 1.5px solid var(--border); color: var(--muted); padding: 4px 11px; border-radius: 99px; cursor: pointer; font-size: 11px; font-family: var(--font); font-weight: 700; transition: all .15s; }
.fpill:hover { border-color: var(--purple); color: var(--purple-dark); }
.fpill.active { background: var(--purple-light); border-color: var(--purple); color: var(--purple-dark); }

/* ── LIST FOOTER ── */
.list-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink2); background: var(--surface2); }

/* ── GOALS ── */
.sec-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.2px; }
.goals-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap: 12px; margin-bottom: 16px; }
.goal-card { background: var(--surface); border-radius: var(--r); padding: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.goal-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.goal-name { font-size: 14px; font-weight: 800; }
.goal-target { font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 600; }
.goal-pct { font-size: 22px; font-weight: 900; color: var(--purple-dark); }
.goal-bar-track { height: 7px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-bottom: 5px; }
.goal-bar-fill { height: 100%; background: linear-gradient(90deg,var(--purple),var(--teal)); border-radius: 99px; transition: width .5s ease; }
.goal-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.goal-deposits { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.goal-dep-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 4px 0; border-top: 1px solid var(--border); }
.goal-dep-row:first-child { border-top: none; }
.goal-dep-amt { font-weight: 700; color: var(--teal-dark); }
.goal-dep-date { color: var(--muted); }
.goal-add { display: flex; gap: 6px; align-items: center; }
.goal-add .add-inp { flex: 1; font-size: 12px; padding: 6px 9px; }
.goal-del { display: flex; align-items: center; }

/* ── CHARTS ── */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.chart-card { background: var(--surface); border-radius: var(--r); padding: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.chart-card canvas { max-height: 196px; }
.chart-title { font-size: 11px; font-weight: 700; color: var(--ink2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.chart-empty { text-align: center; padding: 28px; color: var(--muted); font-size: 12px; font-weight: 500; }

/* ── EMPTY STATE ── */
.empty { text-align: center; padding: 32px 20px; color: var(--muted); }
.empty-ico { font-size: 32px; margin-bottom: 10px; }
.empty-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; color: var(--ink2); }
.empty-sub { font-size: 11px; font-weight: 500; }

/* ── METAS SUMMARY ── */
.metas-summary { background: var(--surface); border-radius: var(--r); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 16px 18px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 11px; }
.metas-summary-row { display: flex; align-items: center; gap: 10px; }
.metas-summary-name { font-size: 12px; font-weight: 700; color: var(--ink2); width: 140px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metas-summary-bar { flex: 1; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
.metas-summary-fill { height: 100%; border-radius: 99px; transition: width .5s ease; min-width: 6px; }
.metas-summary-pct { font-size: 11px; font-weight: 800; width: 34px; text-align: right; flex-shrink: 0; }

/* ── META MODE TOGGLE ── */
.meta-toggle { display: flex; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 18px; width: fit-content; }
.meta-btn { background: none; border: none; padding: 8px 20px; border-radius: 7px; font-family: var(--font); font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); transition: all .15s; }
.meta-btn.active { background: white; color: var(--ink); box-shadow: var(--shadow-sm); }

/* ── SPEND BUDGET CARDS ── */
.spend-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(210px,1fr)); gap: 12px; margin-bottom: 16px; align-items: stretch; }
.spend-card { background: var(--surface); border-radius: var(--r); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; }
.spend-card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
.spend-name { font-size: 14px; font-weight: 800; }
.spend-pct { font-size: 20px; font-weight: 900; color: var(--purple-dark); }
.spend-body { padding: 0 16px 14px; flex: 1; display: flex; flex-direction: column; }
.spend-bar-track { height: 7px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
.spend-bar-fill { height: 100%; border-radius: 99px; transition: width .5s ease; }
.spend-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.spend-entries { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
.spend-ent-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 4px 0; border-top: 1px solid var(--border); }
.spend-ent-note { color: var(--ink2); font-weight: 600; flex: 1; }
.spend-ent-amt  { color: var(--pink-dark); font-weight: 800; }
.spend-ent-date { color: var(--muted); margin: 0 6px; }
.spend-add { display: flex; gap: 6px; align-items: center; margin-top: auto; padding-top: 8px; }
.spend-add .add-inp { font-size: 12px; padding: 6px 9px; }
.spend-limit-row { display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface2); }
.spend-limit-lbl { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.spend-limit-inp { border: none; background: none; font-family: var(--font); font-size: 13px; font-weight: 800; color: var(--ink); text-align: right; outline: none; flex: 1; min-width: 0; }

.tdc-bar-card{background:var(--surface);border:2px solid var(--purple);border-radius:var(--r);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.tdc-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.tdc-bar-title{font-size:13px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;}
.tdc-badge{background:var(--purple-light);color:var(--purple-dark);font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.5px;}
.tdc-bar-nums{font-size:12px;color:var(--muted);font-weight:600;}
.tdc-bar-nums strong{color:var(--ink);font-weight:800;}
.tdc-toggle-btn{border:1.5px solid var(--border);border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;background:transparent;}
.tdc-toggle-btn.on{background:var(--purple-dark);border-color:var(--purple-dark);}
/* ── TOTAL AHORROS CARD ── */
.total-ahorros-card { background: linear-gradient(135deg, var(--pink-dark), var(--purple-dark)); border-radius: var(--r); padding: 20px 24px; margin-bottom: 16px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 24px rgba(201,96,138,0.3); }
.ta-label { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; opacity: .8; margin-bottom: 4px; }
.ta-val { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; }
.ta-sub { font-size: 11px; opacity: .7; margin-top: 3px; font-weight: 500; }
.ta-goals { text-align: right; }
.ta-goals-count { font-size: 22px; font-weight: 900; }
.ta-goals-lbl { font-size: 10px; opacity: .7; font-weight: 600; letter-spacing: 0.5px; }

/* ── DEPOSIT TYPE TOGGLE ── */
.dep-toggle { display: flex; border: 1.5px solid var(--border); border-radius: 7px; overflow: hidden; flex-shrink: 0; }
.dep-btn { background: white; border: none; padding: 5px 9px; font-family: var(--font); font-size: 11px; font-weight: 800; cursor: pointer; color: var(--muted); transition: all .15s; }
.dep-btn.on-dep { background: var(--teal-light); color: var(--teal-dark); }
.dep-btn.on-ret { background: var(--pink-light); color: var(--pink-dark); }

/* ── FADE IN ── */
.fade-in { animation: fi .2s ease; }
@keyframes fi { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

.drag-handle { cursor: grab; color: var(--muted); font-size: 16px; padding: 0 3px; opacity: .35; user-select: none; flex-shrink: 0; line-height: 1; transition: opacity .15s; }
.list-item:hover .drag-handle { opacity: .8; }
.drag-handle:active { cursor: grabbing; opacity: 1; }
.list-item.drag-over { border-top: 2px solid var(--purple); background: var(--purple-light); }
.list-item.dragging  { opacity: .35; }
.edit-btn { background: none; border: none; color: var(--muted); cursor: pointer; width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all .15s; opacity: .35; font-family: var(--font); }
.list-item:hover .edit-btn { opacity: 1; }
.edit-btn:hover { background: var(--purple-light); color: var(--purple-dark); opacity: 1; }
.item-edit-row { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--purple-light); flex-wrap: wrap; }
.item-edit-row .add-inp { background: white; }

/* ── DENSITY ── */
.compact .list-item   { padding: 8px 14px; }
.compact .stat-card   { padding: 11px 14px; }
.compact .add-row     { padding: 8px 12px; gap: 5px; }
.compact .goal-card   { padding: 12px 14px; }
.compact .spend-card-head { padding: 10px 14px 6px; }
.compact .spend-body  { padding: 0 14px 10px; }
.compact .main        { padding: 18px 20px 40px; }
.compact .page-title  { font-size: 19px; }
.compact .sc-val      { font-size: 18px; }
/* hide ARS conversions */
.hide-conv .item-conv { display: none; }
.hide-conv .usd-strip { display: none; }

/* ── RESPONSIVE ── */
@media (max-width: 800px) {
  /* ── LAYOUT ── */
  .shell { flex-direction: column; }
  body { overflow-x: hidden; overflow-y: auto; }
  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .main { padding: 12px 12px 130px; overflow-y: visible; height: auto; }

  /* ── SIDEBAR → HIDDEN (replaced by top bar + bottom nav) ── */
  .sidebar { display: none; }

  /* ── TOP BAR ── */
  .mobile-top { display: flex !important; }

  /* ── BOTTOM NAV ── */
  .mobile-nav { display: flex !important; }

  /* ── CONTENT ── */
  .cards-row { grid-template-columns: 1fr 1fr; }
  .charts-grid { grid-template-columns: 1fr; }
  .add-row { gap: 5px; flex-wrap: wrap; }
  .add-inp.sm { width: 60px; }
  .spend-grid { grid-template-columns: 1fr; }
  .goals-grid { grid-template-columns: 1fr; }
  .cards-row.three { grid-template-columns: 1fr 1fr; }
  .tx-row { flex-wrap: wrap; gap: 6px; }
  .usd-strip { flex-wrap: wrap; gap: 8px; }
  .list-item { padding: 14px 12px; gap: 12px; }
  .item-name { font-size: 14px; }
  .item-meta { font-size: 12px; }
  .item-ico { width: 38px; height: 38px; font-size: 18px; border-radius: 10px; }
  .item-amt { font-size: 15px; }
  .drag-handle { display: none; }
  .del-btn { opacity: 1 !important; }
  .edit-btn { opacity: 1 !important; }
  .add-inp.desc { min-width: 100%; }
  /* Force comfortable density on mobile */
  .list-item,
  .compact .list-item { padding: 18px 14px !important; gap: 14px !important; }
  .compact .stat-card { padding: 16px !important; }
  .compact .add-row { padding: 12px !important; }

const UNDO_KEY = '__undo_stack__';
const getUndoStack = () => { try { return JSON.parse(sessionStorage.getItem(UNDO_KEY)||'[]'); } catch { return []; } };
const saveUndoStack = s => { try { sessionStorage.setItem(UNDO_KEY, JSON.stringify(s.slice(-20))); } catch {} };

const pushUndo = () => {
  const snap = {};
  try { for(let i=0;i<window.localStorage.length;i++){ const k=window.localStorage.key(i); if(k&&k.startsWith('mf_')) snap[k]=window.localStorage.getItem(k); } } catch(e){}
  Object.keys(__store).forEach(k=>{ if(k.startsWith('mf_')) snap[k]=__store[k]; });
  const stack = getUndoStack();
  stack.push(snap);
  saveUndoStack(stack);
};

const popUndo = () => {
  const stack = getUndoStack();
  if(stack.length===0) return false;
  const snap = stack.pop();
  saveUndoStack(stack);
  // Clear current mf_ keys
  try { const keys=[]; for(let i=0;i<window.localStorage.length;i++){const k=window.localStorage.key(i);if(k&&k.startsWith('mf_'))keys.push(k);} keys.forEach(k=>window.localStorage.removeItem(k)); } catch(e){}
  Object.keys(__store).forEach(k=>{ if(k.startsWith('mf_')) delete __store[k]; });
  // Restore snapshot
  Object.entries(snap).forEach(([k,v])=>{ try{window.localStorage.setItem(k,v);}catch(e){} __store[k]=v; });
  window.dispatchEvent(new Event('data-updated'));
  return true;
};

/* ── HELPERS ── */
const uid   = () => Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().split('T')[0];
const fmtD  = s  => { if(!s)return''; const[,m,d]=s.split('-'); return `${d}/${m}`; };
const fARS  = n  => '$\u202f' + Math.abs(n).toLocaleString('es-AR',{maximumFractionDigits:0});
const fUSD  = n  => 'U$S '    + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const fCur  = (n,c) => c==='USD' ? fUSD(n) : fARS(n);
const toARS = (n,c,r) => c==='USD' ? n*r : n;

const calcSummary = (y,m,rate) => {
  const tx       = gTx(y,m);
  const fx       = gFx(y,m);
  const goals    = gGoals();
  const rateMami = gRateMami();
  const rateSav  = gRateSav();
  const tdcCats  = gSpendBdg().filter(b=>b.tdc).map(b=>b.name);
  const monthStr = y+'-'+String(m+1).padStart(2,'0');

  // Ingresos — con tipos de cambio correctos
  const income = tx.filter(t=>t.type==='income').reduce((a,t)=>{
    if(t.currency==='ARS') return a+t.amount;
    if(t.desc==='Aporte Mami') return a+toARS(t.amount,t.currency,rate,rateMami);
    return a+toARS(t.amount,t.currency,rate,rateSav);
  },0);

  // Gastos fijos — todos
  const fijos = fx.reduce((a,f)=>a+toARS(f.amount,f.currency,rate),0);

  // Balance fijo = Ingresos - Fijos (nunca cambia)
  const balance = income - fijos;

  // Gastos variables NO TDC en movimientos
  const varExpNonTDC = tx.filter(t=>t.type==='expense'&&!tdcCats.includes(t.category)).reduce((a,t)=>a+toARS(t.amount,t.currency,rate),0);
  const varExp       = tx.filter(t=>t.type==='expense').reduce((a,t)=>a+toARS(t.amount,t.currency,rate),0);

  // Depósitos en metas no-BOA restan del presupuesto libre, retiros suman
  const savingsLibreDeposits = goals
    .filter(g=>g.name!=='Bank of america'&&g.name!=='Bank of America')
    .reduce((a,g)=>a+(g.deposits||[])
      .filter(d=>d.date&&d.date.startsWith(monthStr)&&d.amount>0)
      .reduce((s,d)=>s+(d.currency==='ARS'?d.amount:d.amount*rateSav),0),0);
  const savingsLibreRetiros = goals
    .filter(g=>g.name!=='Bank of america'&&g.name!=='Bank of America')
    .reduce((a,g)=>a+(g.deposits||[])
      .filter(d=>d.date&&d.date.startsWith(monthStr)&&d.amount<0)
      .reduce((s,d)=>s+(d.currency==='ARS'?Math.abs(d.amount):Math.abs(d.amount)*rateSav),0),0);
  // Presupuesto libre = Balance - gastos NO TDC - depósitos en ahorros Pesos + retiros de ahorros Pesos
  const presupuestoLibre = balance - varExpNonTDC - savingsLibreDeposits + savingsLibreRetiros;
  const totalUsadoLibre = varExpNonTDC + savingsLibreDeposits - savingsLibreRetiros;
  const savingsLibre = savingsLibreDeposits;
  const libreUsedPct = balance>0 ? Math.min((totalUsadoLibre/balance)*100,100) : 0;

  // Savings
  const savingsDeposits = goals.reduce((a,g)=>a+(g.deposits||[]).filter(d=>d.date&&d.date.startsWith(monthStr)&&d.amount>0).reduce((s,d)=>s+toARS(d.amount,d.currency,rate,rateSav),0),0);
  const fijosPagados    = fx.filter(f=>f.paid).reduce((a,f)=>a+toARS(f.amount,f.currency,rate),0);
  const totalGastado    = fijosPagados + varExp + savingsDeposits;

  return { income, fijos, balance, varExpNonTDC, varExp, presupuestoLibre, libreUsedPct, fijosPagados, savings:savingsDeposits, totalGastado, totalUsadoLibre, savingsLibre };
};
